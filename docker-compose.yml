services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Healthcheck so dependents wait until Postgres actually accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  # One-shot: applies Drizzle migrations + seed, then exits. Replaces the old
  # docker-entrypoint-initdb.d approach with tracked, incremental migrations.
  migrate:
    build:
      context: .
      target: migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://clinic:clinic@db:5432/clinic

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # `db` is the compose service name = DNS hostname on the shared network.
      DATABASE_URL: postgres://clinic:clinic@db:5432/clinic
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"

volumes:
  pgdata:
