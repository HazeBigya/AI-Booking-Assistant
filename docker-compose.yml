services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Healthcheck so dependents wait until Postgres actually accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  # One-shot: applies Drizzle migrations + seed, then exits. Replaces the old
  # docker-entrypoint-initdb.d approach with tracked, incremental migrations.
  migrate:
    build:
      context: .
      target: migrator
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://clinic:clinic@db:5432/clinic

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # `db` is the compose service name = DNS hostname on the shared network.
      DATABASE_URL: postgres://clinic:clinic@db:5432/clinic
      # Which provider(s) to use, in priority order. Must default to EMPTY — a
      # non-empty default here would silently override what .env says.
      AI_PROVIDER: ${AI_PROVIDER:-}
      LLM_PROVIDERS: ${LLM_PROVIDERS:-} # backwards-compatible alias
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      CUSTOM_MODEL: ${CUSTOM_MODEL:-}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-UTC}
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-insecure-secret-change-me}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"

volumes:
  pgdata:
